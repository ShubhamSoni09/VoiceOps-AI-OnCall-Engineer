<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoiceOps · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root, :root[data-theme="dark"] {
  --bg: #100f0d; --panel: #16140f; --elev: #1c1a15; --line: rgba(255,250,238,0.075);
  --ink: #f3efe6; --ink-dim: #a6a097; --ink-faint: #6c665d;
  --accent: #ffb02e; --on-accent: #1a1305; --crit: #f0635f;
  --btn-bg: #f3efe6; --btn-fg: #15130e;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f4ef; --panel: #fbfaf6; --elev: #ffffff; --line: rgba(28,22,12,0.10);
  --ink: #1c1813; --ink-dim: #6a6357; --ink-faint: #97907f;
  --accent: #b9760a; --on-accent: #fff8ec; --crit: #cf3a33;
  --btn-bg: #1c1813; --btn-fg: #f6f4ef;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Inter Tight", system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
}
.shell { width: 100%; max-width: 420px; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; justify-content: center; }
.logo {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 18px;
}
.brand b { font-size: 22px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 28px 24px; box-shadow: 0 18px 40px -22px rgba(0,0,0,0.45);
}
.card h1 { font-size: 20px; margin-bottom: 6px; }
.card p { color: var(--ink-dim); font-size: 14px; margin-bottom: 22px; line-height: 1.5; }
label { display: block; font-size: 12px; color: var(--ink-faint); margin-bottom: 6px; }
input {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font-size: 14px; margin-bottom: 14px;
}
input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
button[type="submit"] {
  width: 100%; margin-top: 6px; padding: 12px; border: none; border-radius: 10px;
  background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; font-size: 14px; cursor: pointer;
}
button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
.error {
  display: none; margin-bottom: 14px; padding: 10px 12px; border-radius: 10px;
  background: color-mix(in srgb, var(--crit) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--crit) 35%, transparent);
  color: var(--crit); font-size: 13px;
}
.error.visible { display: block; }
.error a { color: var(--accent); }
.error code { font-family: "JetBrains Mono", monospace; font-size: 11px; background: var(--bg); padding: 2px 5px; border-radius: 4px; }
.demo {
  margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--ink-faint); line-height: 1.6;
}
.demo code {
  font-family: "JetBrains Mono", monospace; font-size: 11px;
  background: var(--bg); padding: 2px 6px; border-radius: 4px;
}
.divider {
  display: flex; align-items: center; gap: 12px; margin: 18px 0 16px;
  color: var(--ink-faint); font-size: 12px;
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}
.btn-github {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--elev); color: var(--ink); font-weight: 600; font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-github:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="logo">V</div>
    <div><b>VoiceOps</b><div style="font-size:12px;color:var(--ink-faint)">on-call console</div></div>
  </div>
  <div class="card">
    <h1>Sign in</h1>
    <p>Sign in with GitHub to access your repository, or use a demo account.</p>
    <div class="error" id="error"></div>
    <button type="button" class="btn-github" id="githubBtn">
      <i class="ph ph-github-logo"></i> Continue with GitHub
    </button>
    <div class="divider">or email</div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="priya@voiceops.dev" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      <button type="submit" id="submitBtn">Continue to console</button>
    </form>
    <div class="demo">
      <strong>Demo accounts</strong><br />
      On-call: <code>priya@voiceops.dev</code> / <code>oncall123</code><br />
      Viewer: <code>viewer@voiceops.dev</code> / <code>view123</code><br />
      Admin: <code>admin@voiceops.dev</code> / <code>admin123</code>
    </div>
  </div>
</div>
<script>
(function () {
  const TOKEN_KEY = "voiceops_token";
  const params = new URLSearchParams(location.search);
  const tokenFromGithub = params.get("token");
  if (tokenFromGithub) {
    localStorage.setItem(TOKEN_KEY, tokenFromGithub);
    location.replace(params.get("select_repo") === "1" ? "/dashboard?select_repo=1" : "/dashboard");
    return;
  }
  if (localStorage.getItem(TOKEN_KEY)) {
    location.replace("/dashboard");
    return;
  }
  if (params.get("github") === "error") {
    const reason = params.get("reason") || "GitHub sign-in failed";
    const el = document.getElementById("error");
    if (reason.toLowerCase().includes("not configured")) {
      el.innerHTML = "<strong>GitHub OAuth is not configured.</strong><br><br>" +
        "1. Open <a href=\"https://github.com/settings/developers\" target=\"_blank\" rel=\"noopener\">GitHub Developer Settings</a> → OAuth Apps → New.<br>" +
        "2. Callback URL: <code>http://127.0.0.1:8001/auth/github/callback</code><br>" +
        "3. Add <code>GITHUB_CLIENT_ID</code> and <code>GITHUB_CLIENT_SECRET</code> to <code>backend/.env</code>.<br>" +
        "4. Restart the backend.";
    } else {
      el.textContent = reason;
    }
    el.classList.add("visible");
    history.replaceState({}, "", "/login");
  }
  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("error");
  const submitBtn = document.getElementById("submitBtn");
  const githubBtn = document.getElementById("githubBtn");

  githubBtn.addEventListener("click", function () {
    errorEl.classList.remove("visible");
    location.href = "/auth/github/login";
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorEl.classList.remove("visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";
    try {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Login failed");
      localStorage.setItem(TOKEN_KEY, data.access_token);
      location.href = "/dashboard";
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add("visible");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Continue to console";
    }
  });
})();
</script>
</body>
</html>
